<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini AI Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b12;color:#eef2ff;font-family:Arial,sans-serif}
.app{max-width:900px;margin:auto;padding:20px}.card{background:#111827;border:1px solid #273449;border-radius:20px;padding:20px;margin-bottom:16px}
h1{margin:0 0 6px}.muted{color:#9ca8bd}textarea,input,select{width:100%;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:12px;padding:12px;font:inherit}
textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:12px 16px;background:#635bff;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#263449}
button:disabled{opacity:.5;cursor:not-allowed}#status{margin-top:12px;color:#9ca8bd}.result{margin-top:16px;display:none}.result img{max-width:100%;border-radius:16px;border:1px solid #334155}
.history{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.history img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="card"><h1>Mini AI Studio</h1><div class="muted">Lightweight text assistant + image generation/editing frontend.</div></div>

<div class="card">
<h2>Text AI</h2>
<textarea id="text" placeholder="Ask something or write an editing instruction..."></textarea>
<div class="buttons"><button onclick="runText()">Run Text AI</button></div>
<pre id="textOut" style="white-space:pre-wrap"></pre>
</div>

<div class="card">
<h2>Image AI</h2>
<textarea id="prompt" placeholder="Example: futuristic blue and purple AI laboratory"></textarea>
<div class="row">
<label>Style<select id="style"><option>photorealistic</option><option>digital art</option><option>anime</option><option>cinematic</option><option>watercolor</option><option>pixel art</option></select></label>
<label>Size<select id="size"><option value="512">512</option><option value="768">768</option><option value="1024">1024</option></select></label>
</div>
<div class="buttons">
<button id="gen" onclick="generateImage()">Generate Image</button>
<button class="secondary" onclick="document.getElementById('file').click()">Upload Image</button>
<input id="file" type="file" accept="image/*" hidden onchange="previewUpload()">
</div>
<div id="status"></div><div id="uploadPreview"></div>
<div class="result" id="result"><img id="output"><div class="buttons"><button class="secondary" onclick="downloadImage()">Download</button></div></div>
</div>

<div class="card"><h2>Recent Images</h2><div class="history" id="history"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let lastURL=null,uploaded=null;
function buildPrompt(){return `${$('prompt').value.trim()}, ${$('style').value}, high quality`}

async function generateImage(){
 const prompt=$('prompt').value.trim();
 if(!prompt){$('status').textContent='Enter a prompt first.';return}
 $('gen').disabled=true;$('status').textContent='Generating...';
 try{
  const endpoint=localStorage.getItem('IMAGE_AI_ENDPOINT');
  if(!endpoint) throw new Error('No image model endpoint configured. Set IMAGE_AI_ENDPOINT in localStorage.');
  const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({prompt:buildPrompt(),size:Number($('size').value),image:uploaded})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const data=await r.json(); if(!data.image) throw new Error('Model returned no image.');
  showImage(data.image);$('status').textContent='Done.';
 }catch(e){$('status').textContent='Image generation error: '+e.message}
 finally{$('gen').disabled=false}
}
function showImage(src){
 lastURL=src;$('output').src=src;$('result').style.display='block';
 const item=document.createElement('img');item.src=src;$('history').prepend(item);
 while($('history').children.length>12)$('history').lastChild.remove();
}
function downloadImage(){if(!lastURL)return;const a=document.createElement('a');a.href=lastURL;a.download='mini-ai-image.png';a.click()}
function previewUpload(){
 const f=$('file').files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{uploaded=r.result;$('uploadPreview').innerHTML='<p class="muted">Image loaded for an edit request.</p>'};r.readAsDataURL(f)
}
async function runText(){
 const prompt=$('text').value.trim();if(!prompt)return;$('textOut').textContent='Working...';
 const endpoint=localStorage.getItem('TEXT_AI_ENDPOINT');
 if(!endpoint){$('textOut').textContent='No text model endpoint configured. Set TEXT_AI_ENDPOINT in localStorage.';return}
 try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
 const d=await r.json();$('textOut').textContent=d.text||JSON.stringify(d)}
 catch(e){$('textOut').textContent='Text AI error: '+e.message}
}
</script>
</body>
</html>
